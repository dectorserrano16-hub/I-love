<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>I LOVE ❤️</title>
<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}
pre{
    color:#ff4d6d;
    font-family:monospace;
    font-size:12px;
    line-height:12px;
}
</style>
</head>
<body>

<pre id="heart"></pre>

<script>
let heart = "";
const text = "I LOVE ";

for (let y = 1.5; y > -1.5; y -= 0.08) {
    for (let x = -1.5; x < 1.5; x += 0.04) {
        let a = x*x + y*y - 1;
        if (a*a*a - x*x*y*y*y <= 0) {
            heart += text[(heart.length % text.length)];
        } else {
            heart += " ";
        }
    }
    heart += "\n";
}

document.getElementById("heart").textContent = heart;
</script>

</body>
</html>
